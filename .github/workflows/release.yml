name: Release

# Ein Tag wie 0.9.1 (ohne "v" - so erwartet es Obsidian) baut Plugin und Engine und legt das
# Release an: main.js, manifest.json, styles.css (Obsidian, BRAT) und das Wheel der Engine
# (Knopf "Engine installieren" im Plugin).
on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Version passt zum Tag
        run: python scripts/version.py --pruefen "$GITHUB_REF_NAME"
      - name: Engine-Tests
        run: |
          python -m pip install -e engine
          python engine/tests/test_tools.py
          python engine/tests/test_harness.py
      - name: Plugin-Tests und Build
        working-directory: plugin
        run: |
          npm ci
          npm test
          npm run build:dist
      - name: Engine-Wheel
        run: python -m pip wheel ./engine --no-deps -w engine/dist
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          plugin/dist/main.js manifest.json plugin/dist/styles.css engine/dist/*.whl
