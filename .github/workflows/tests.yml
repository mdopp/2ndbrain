name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Engine installieren
        run: python -m pip install -e engine
      - name: Engine-Tests (eigene Test-Vaults, ohne Modell)
        run: |
          python engine/tests/test_tools.py
          python engine/tests/test_harness.py
      - name: Plugin-Tests und Build
        working-directory: plugin
        run: |
          npm ci
          npm test
          npm run build:dist
  pins:
    # actions by commit, base images by digest; Dependabot moves them (laib ADR 0034, laib#1165)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/pins.sh
