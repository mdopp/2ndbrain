name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Engine installieren
        run: python -m pip install -e engine
      - name: Engine-Tests (eigene Test-Vaults, ohne Modell)
        run: |
          python engine/tests/test_tools.py
          python engine/tests/test_harness.py
      - name: Plugin-Tests und Build
        working-directory: plugin
        run: |
          npm ci
          npm test
          npm run build:dist
  pins:
    # actions by commit, base images by digest; Dependabot moves them (laib ADR 0034, laib#1165)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/pins.sh
