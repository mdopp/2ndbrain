name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Engine installieren
        run: python -m pip install -e engine
      - name: Engine-Tests (eigene Test-Vaults, ohne Modell)
        run: |
          python engine/tests/test_tools.py
          python engine/tests/test_harness.py
      - name: Plugin-Tests und Build
        working-directory: plugin
        run: |
          npm ci
          npm test
          npm run build:dist
